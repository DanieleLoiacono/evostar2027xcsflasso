[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcsf-python"
version = "2.1.0"
description = "XCSF function approximation implemented in Python with a scikit-learn API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.6,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pandas>=2", "matplotlib>=3.6"]
plot = ["matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
